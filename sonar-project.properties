# Required metadata
sonar.projectKey=segurosbolivar_cumplimientodigital-frontend
sonar.projectName=cumplimientodigital-frontend

sonar.organization=segurosbolivar
sonar.host.url=https://sonarcloud.io

# Comma-separated paths to directories with sources (required)
sonar.sources=src

# Language
sonar.sourceEncoding=UTF-8

# Exclusions - Solo node_modules y archivos de estilos (según política DevOps)
sonar.exclusions=node_modules/**,**/*.css,**/*.scss,**/*.less

# Coverage exclusions - Excluir archivos sin tests
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.mock.ts,**/*.module.ts,**/*.interface.ts,**/*.d.ts,**/main.ts,**/polyfills.ts,**/environments/**,**/lib/**,**/util-testing/**,**/models/**,**/guards/**,**/interceptors/**,**/configs/**,**/services/api-gateway.service.ts,**/services/auth.service.ts,**/services/cobertura.service.ts,**/services/cotizacion.service.ts,**/services/cliente.service.ts,**/containers/contract-reader/**,**/containers/credit-limit-validation/**,**/containers/dashboard/**,**/containers/dynamic-form/**,**/containers/financial-statement-reader/**,**/containers/login/**,**/containers/management/**,**/containers/modification-selection/**,**/containers/policy-generation/**,**/containers/policy-input/**,**/containers/policy-modification/**,**/containers/portal/**,**/containers/product-selection/**,**/containers/quote-details/**,**/containers/third-party-validation/**,**/app.component.ts

# CPD exclusions
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/*.mock.ts,**/environments/**,**/configs/**

# Coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Force deprecated Java version
sonar.scanner.force-deprecated-java-version=true
