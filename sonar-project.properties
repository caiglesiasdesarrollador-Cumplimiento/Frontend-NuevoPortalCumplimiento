# Required metadata
sonar.projectKey=segurosbolivar_cumplimientodigital-frontend
sonar.projectName=cumplimientodigital-frontend

sonar.organization=segurosbolivar
sonar.host.url=https://sonarcloud.io
# Comma-separated paths to directories with sources (required)
sonar.sources=./

# Language
sonar.language=js
sonar.profile=node
# Encoding of sources files
sonar.sourceEncoding=UTF-8

# Exclusions - Solo node_modules y archivos de estilos (según política DevOps)
sonar.exclusions=node_modules/**,**/*.css,**/*.scss,**/*.less

# Coverage exclusions - Archivos que no son código de producción
sonar.coverage.exclusions=dist/**,coverage/**,.angular/**,**/*.spec.ts,**/*.test.ts,**/*.mock.ts,**/*.module.ts,**/*.config.ts,**/*.config.js,**/*.pattern.ts,setup-jest.ts,**/main.ts,**/polyfills.ts,**/environments/**,**/*.d.ts

# CPD exclusions - Evitar falsos positivos de duplicación
sonar.cpd.exclusions=dist/**,coverage/**,.angular/**,**/*.spec.ts,**/*.test.ts,**/*.mock.ts,**/environments/**

# Coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Force deprecated Java version
sonar.scanner.force-deprecated-java-version=true
